<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Christmas Lists{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% if turnstile_site_key %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endif %}
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">🎄 {{ group.name if group else "Christmas Lists" }}</a>
  {% if me %}
  <nav>
    <a href="/p/{{ me.id }}">My list</a>
    <a href="/shopping">My shopping</a>
    <a href="/account">Account</a>
    {% if me.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Log out {{ me.name }}</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
