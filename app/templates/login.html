{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Hi {{ person.name }}</h1>
  {% if locked %}
    <p class="error">Too many wrong PINs. Try again in about {{ (locked // 60) + 1 }} minutes, or ask the admin to reset your PIN.</p>
  {% else %}
  <form method="post" action="/login/{{ person.id }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Your PIN
      <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" required maxlength="6" autocomplete="current-password" autofocus>
    </label>
    {% include "_turnstile.html" %}
    <button>Log in</button>
  </form>
  {% endif %}
  <p><a href="/">Not {{ person.name }}?</a></p>
</div>
{% endblock %}
