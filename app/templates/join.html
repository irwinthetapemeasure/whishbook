{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Add yourself</h1>
  <form method="post" action="/join">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Your name
      <input name="name" value="{{ name }}" required maxlength="40" autocomplete="off" autofocus>
    </label>
    <label>Choose a PIN (4–6 digits)
      <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" required maxlength="6" autocomplete="new-password">
    </label>
    <label>PIN again
      <input type="password" name="pin2" inputmode="numeric" pattern="[0-9]{4,6}" required maxlength="6" autocomplete="new-password">
    </label>
    <p class="muted small">Your PIN stops others from changing your list. Don't use your bank PIN.</p>
    {% include "_turnstile.html" %}
    <button>Create my list</button>
  </form>
</div>
{% endblock %}
